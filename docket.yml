# Read from the base commit of every pull request, never from the candidate.
version: 1
sourceRoot: force-app
apiVersion: '62.0'

environments:
  qa:
    # A pull request must target this branch to reach the QA org.
    branch: main
    # The alias the workflow authenticates as, never a credential.
    org: docket-qa
    # Deletions are allowed in QA and nowhere else by default. Turning this on
    # changes every plan's identity, so anything validated under the old policy
    # has to be validated again.
    allowDestructiveChanges: true
    tests:
      # Every local test, so a newly added class is covered by the run that
      # deploys it. A Developer Edition org enforces coverage like production.
      mode: all
    gates:
      - name: apex-naming
        run: |
          set -euo pipefail
          ! grep -rln "TODO" force-app/main/default/classes || {
            echo "An Apex class still carries a TODO marker." >&2
            exit 1
          }
        timeoutMinutes: 2
